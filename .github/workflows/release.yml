# Release per Knopf: Actions → Release → „Run workflow“ auf main.
# Liest die Version aus manifest.json, baut das Paket, lädt es in den Chrome Web Store
# hoch, reicht es zur Prüfung ein und legt Tag v<version> und GitHub-Release mit dem ZIP an.
# Einrichtung der Secrets: store/chrome-web-store-api.md
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_ITEM_ID: cfflgepphklkecaeemcmlbkokeojidgh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version prüfen
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Release nur von main (gestartet auf ${GITHUB_REF_NAME})"
            exit 1
          fi
          version=$(node -p "require('./manifest.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::Version ${version} ist schon veröffentlicht. Erst manifest.json und CHANGELOG.md erhöhen."
            exit 1
          fi
          grep -q "^## ${version} " CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt für ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Paket bauen
        run: echo "ZIP=$(./scripts/build.sh)" >> "$GITHUB_ENV"

      - name: Chrome Web Store – hochladen und einreichen
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: ./scripts/chrome-store-upload.sh "$ZIP"

      - name: Tag und GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "v${VERSION}" "$ZIP" --target "$GITHUB_SHA" --title "Belegtext ${VERSION}" --notes-file notes.md
